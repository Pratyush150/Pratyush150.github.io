    <script>
      // Applied before first paint, so nothing flashes and no reveal is hidden
      // from a reader whose JavaScript never arrives.
      //
      //   .js        the reveal primitives are allowed to start hidden
      //   motion     ON / OFF, taken from the reader's OS preference
      (function () {
        var d = document.documentElement;
        var reduce = false;
        try {
          reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {
          /* older browser: treat as no preference */
        }
        var motion = reduce ? 'off' : 'on';
        d.setAttribute('data-motion', motion);
        try {
          if ('IntersectionObserver' in window && motion === 'on' && !reduce) {
            d.classList.add('js');
          }
        } catch (e) {
          /* leave every reveal in its final position */
        }
      })();
    </script>
